{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta name="description" content="Sonador: Open Source Medical Imaging Research" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1.0,minimum-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="cleartype" content="on" />
  <meta name="MobileOptimized" content="320" />
  <meta name="HandheldFriendly" content="True" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>Viewer | Sonador</title>
</head>

<style>
  .header-brand {
    height: 56px; width: 175px;
    background-image: url('{{ logo  }}');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: left;
  }

  {% if logo_narrow %}
  /* Square mark shown in place of the wordmark when the viewer's studylist sidebar is
     collapsed (ohif-viewers#128). Emitted only when the context actually carries a narrow
     logo: an unguarded `url('')` renders as an empty 28px box, and because the paired
     whiteLabeling function below would still exist, the viewer's own bundled mark would never
     get the chance to fill in. */
  .header-brand-narrow {
    height: 28px; width: 28px;
    background-image: url('{{ logo_narrow }}');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }
  {% endif %}
</style>

<body id="body">
  <noscript> You need to enable JavaScript to run this app. </noscript>

  <div id="root"></div>
  
  <!-- OHIF and Plugins -->
  <script src="{% static 'js/ohif/index.umd.js' %}" crossorigin></script>


  <!-- Empty State Message -->
  {% if empty_state %}<script id="empty-state-message" type="text/template">{{ empty_state }}</script>{% endif %}

  <!-- Farewell Message (sign-out confirmation page) -->
  {% if farewell %}<script id="farewell-message" type="text/template">{{ farewell }}</script>{% endif %}


  <!-- Configure User Interface Messages -->
  <script>
  // Ensure that Sonador element for window is defined
  if (!window.sonador) {
    window.sonador = {};
  }

  // Populate Sonador index page settings
  if (!window.sonador.home) {

    // Add empty state message
    var emptystate_element = document.getElementById('empty-state-message');
    if (emptystate_element && !window.sonador.home) {
      window.sonador.home = {
        message: emptystate_element.innerHTML,
      };
    }
  }

  // Populate the sign-out confirmation message
  if (!window.sonador.signedout) {
    var farewell_element = document.getElementById('farewell-message');
    if (farewell_element) {
      window.sonador.signedout = {
        message: farewell_element.innerHTML,
      };
    }
  }

  {% if SONADOR_URL %}
  // Populate Sonador Connection URL
  if (!window.sonador.host) window.sonador.host = '{{ SONADOR_URL }}';
  {% endif %}
  </script>


  <!-- PACS Server Connection -->
  {{ pacs_server|json_script:'pacs-connection' }}

  <!-- Initialize Viewer -->
  <script>
    var containerId = 'root';

    // Retrieve application configuration and initialize
    fetch("{{ pacs_config }}") 
      .then(response => response.json())
      .then(function(rjson){
        console.log('Config: ', rjson);

        window.config = rjson;
        
        // Read PACS server connection from JSON string
        window.config.servers.dicomWeb = JSON.parse(document.getElementById('pacs-connection').innerHTML);

        // Logos and branding for viewer
        window.config.whiteLabeling = {
          createLogoComponentFn: function(React) {
            return React.createElement('a', {
              rel: 'noopener noreferrer',
              className: 'header-brand',
            });
          },
          {% if logo_narrow %}
          // Defined ONLY when the site actually has a narrow logo to point at. App.js hands this
          // whole object to WhiteLabelingContext.Provider in place of the defaults rather than
          // merging with them, so defining this unconditionally would shadow the viewer's bundled
          // Sonador mark with an empty box on every deployment whose context lacks logo_narrow.
          createNarrowLogoComponentFn: function(React) {
            return React.createElement('a', {
              rel: 'noopener noreferrer',
              className: 'header-brand-narrow',
              href: '/',
            });
          },
          {% endif %}
          emptyStateMessageFn: function(React) {
            return window.config?.branding?.empty_state || window.sonador.home?.message;
          },
          signedOutMessageFn: function(React) {
            return window.config?.branding?.farewell || window.sonador.signedout?.message;
          }
        }

        // Extensions
        window.config.extensions = [
          window.OHIFViewer.OHIFDicomHtmlExtension,
          window.OHIFViewer.OHIFDicomMicroscopyExtension,
          window.OHIFViewer.OHIFDicomPDFExtension,
          window.OHIFViewer.OHIFDicomSegmentationExtension,
          window.OHIFViewer.OHIFDicomRtExtension,
          window.OHIFViewer.OHIFDicomECGExtension,

          // 3D Visualization 
          window.OHIFViewer.OHIFVTKExtension,
          window.OHIFViewer.OHIF3DVolumeViewerExtension,
          window.OHIFViewer.OHIFM3DViewerExtension,
          window.OHIFViewer.OHIFSegEditorExtension,

          // Metadata
          window.OHIFViewer.OHIFDicomTagBrowserExtension,
        ];

        window.OHIFViewer.installViewer(
          // Configuration and container ID
          window.config, containerId,

          // Completion callback
          function() {
            console.log('OHIF initialized successfully!');
            console.log(window.sonador);
          }
        )
      });    
  </script>
</body>

</html>
