{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta name="description" content="Sonador: Open Source Medical Imaging Research" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1.0,minimum-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="cleartype" content="on" />
  <meta name="MobileOptimized" content="320" />
  <meta name="HandheldFriendly" content="True" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <script
    src="https://polyfill.io/v3/polyfill.min.js?flags=gated&features=default%2CObject.values%2CArray.prototype.flat%2CObject.entries%2CSymbol%2CArray.prototype.includes%2CString.prototype.repeat%2CArray.prototype.find"></script>

  <title>Viewer | Sonador</title>
</head>

<style>
  .header-brand {
    height: 56px; width: 175px;
    background-image: url('{% static 'images/sonador-logo.ng.svg' %}');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: left;
  }
</style>

<body>
  <noscript> You need to enable JavaScript to run this app. </noscript>

  <div id="root"></div>
  
  <!-- OHIF and Plugins -->
  <script src="{% static 'js/ohif/index.umd.js' %}" crossorigin></script>


  <!-- Empty State Message -->
  {% if empty_state %}<script id="empty-state-message">{{ empty_state }}</script>{% endif %}


  <!-- Configure User Interface Messages -->
  <script>
  // Ensure that Sonador element for window is defined
  if (!window.sonador){
    window.sonador = {};
  }

  // Populate Sonador index page settings
  if (!window.sonador.home) {

    // Add empty state message
    var emptystate_element = document.getElementById('empty-state-message');
    if (emptystate_element && !window.sonador.home) {
      window.sonador.home = {
        message: emptystate_element.innerHTML,
      };
    }
  }
  </script>


  <!-- PACS Server Connection -->
  {{ pacs_server|json_script:'pacs-connection' }}

  <!-- Initialize Viewer -->
  <script>
    var containerId = 'root';

    // Retrieve application configuration and initialize
    fetch("{{ pacs_config }}") 
      .then(response => response.json())
      .then(function(rjson){
        window.config = rjson;
        
        // Read PACS server connection from JSON string
        window.config.servers.dicomWeb = JSON.parse(document.getElementById('pacs-connection').innerHTML);

        // Logos and branding for viewer
        window.config.whiteLabeling = {
          createLogoComponentFn: function(React) {
            return React.createElement('a', {
              rel: 'noopener noreferrer',
              className: 'header-brand',
            });
          }
        }

        // Extensions
        window.config.extensions = [
          window.OHIFViewer.OHIFExtCornerstone,
          window.OHIFViewer.OHIFVTKExtension,
          window.OHIFViewer.OHIFDicomHtmlExtension,
          window.OHIFViewer.OHIFDicomMicroscopyExtension,
          window.OHIFViewer.OHIFDicomPDFExtension,
          window.OHIFViewer.OHIFDicomSegmentationExtension,
          window.OHIFViewer.OHIFDicomRtExtension,
          window.OHIFViewer.OHIFDicomTagBrowserExtension,
        ];

        window.OHIFViewer.installViewer(
          // Configuration and container ID
          window.config, containerId,

          // Completion callback
          function() {
            console.log('OHIF initialized successfully!');
          }
        )
      });    
  </script>
</body>

</html>
