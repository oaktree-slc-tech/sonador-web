stages:
- build
- test
- deploy

variables:
  AUTO_DEVOPS_BUILD_IMAGE_FORWARDED_CI_VARIABLES: CI_COMMIT_SHA,CI_ENVIRONMENT_NAME,CI_ENVIRONMENT_SLUG

# Include AutoDevops build
include:
- local: .ci/jobs/build.gitlab-ci.yml


# Build containers for master and review
docker-build:
  extends: .ci:stage:build
  rules:
  - if: '$CI_COMMIT_BRANCH == "master"'

#Prep container for tests in event of merge request
docker-review:
  extends: .ci:stage:build
  rules:
  - if: $CI_MERGE_REQUEST_IID
  - if: $CI_COMMIT_TAG
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'


# Run unit tests against PostgreSQL database
test:
  stage: test
  image: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA
  retry:
    max: 2
    when:
    - runner_system_failure
    - stuck_or_timeout_failure
    - unknown_failure
    - stale_schedule
    - job_execution_timeout
    - scheduler_failure

#Postgres info to let sonador access DB
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: images-control@medical-db
    POSTGRES_DB: sonador
    SONADOR_SITECONFIG: "/srv/www/sonador/config/sonador.site.config"
    DJANGO_SETTINGS_MODULE: "sonador.settings"
    # Surface service-container logs; the k8s executor does not health-check services.
    CI_DEBUG_SERVICES: "true"

  services:
  - name: postgres:16
    alias: sonador-db
  # docker.io/library/minio does not exist; the official image is minio/minio and
  # needs an explicit server command to start.
  - name: minio/minio:latest
    alias: object-storage
    command: ["server", "/data"]

  script:
  - ln -s /srv/www/sonador/sonador/config/sonador.site.config /srv/www/sonador/config/sonador.site.config
  # The k8s executor starts services in-pod without waiting for readiness; give
  # postgres up to 2 minutes to finish initdb before the suite touches it.
  - |
    python3 - <<'PY'
    import socket, sys, time
    for _ in range(60):
        try:
            socket.create_connection(("sonador-db", 5432), timeout=1).close()
            print("postgres is accepting connections")
            sys.exit(0)
        except OSError:
            time.sleep(2)
    sys.exit("postgres never became reachable on sonador-db:5432")
    PY
  - cd /srv/www/sonador/sonador/
  - python3 manage.py test --nomigrations guru secure visionaire

  rules:
  - if: '$CI_COMMIT_BRANCH == "master"'
  - if: $CI_MERGE_REQUEST_IID
  - if: $CI_COMMIT_TAG
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


# Publish Docker Image to Imaging Environment Registry.
# skopeo copies registry-to-registry with no docker daemon; the cluster runners are
# non-privileged and cannot run docker:dind.
publish-oaktree:
  stage: deploy
  image:
    name: quay.io/skopeo/stable:latest
    entrypoint: [""]

  only:
    refs:
    - master
    variables:
    - $DOCKER_PUBLISH_PASSWORD
    - $DOCKER_PUBLISH_USER

  script:
  - skopeo copy
    --src-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD"
    --dest-creds "$DOCKER_PUBLISH_USER:$DOCKER_PUBLISH_PASSWORD"
    "docker://$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA"
    "docker://$CI_REGISTRY/oak-tree/medical-imaging/imaging-development-env/sonador:latest"

#Publish Docker to Docker Hub
publish-docker:
  stage: deploy
  image:
    name: quay.io/skopeo/stable:latest
    entrypoint: [""]

  only:
    refs:
    - master
    variables:
    - $DOCKER_HUB_SERVICE_PASSWORD
    - $DOCKER_HUB_SERVICE_USER

  script:
  - skopeo copy
    --src-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD"
    --dest-creds "$DOCKER_HUB_SERVICE_USER:$DOCKER_HUB_SERVICE_PASSWORD"
    "docker://$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA"
    "docker://docker.io/oaktreetech/sonador:latest"
